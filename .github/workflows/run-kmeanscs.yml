name: Exécuter kmeanscs.py

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Exécuter le script
      run: python kmeanscs.py
    
    - name: Vérifier les fichiers générés
      run: ls -la *.png 2>/dev/null || echo "Aucun fichier PNG trouvé"
    
    - name: Commiter les fichiers générés
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Ajouter tous les fichiers PNG
        if [ -f trace_output.png ]; then
          git add trace_output.png
          echo "trace_output.png ajouté"
        fi
        
        if [ -f confusion_matrix.png ]; then
          git add confusion_matrix.png
          echo "confusion_matrix.png ajouté"
        fi
        
        if [ -f signaux_fourier.png ]; then
          git add signaux_fourier.png
          echo "signaux_fourier.png ajouté"
        fi
        
        if [ -f features_clusters.png ]; then
          git add features_clusters.png
          echo "features_clusters.png ajouté"
        fi
        
        # Commiter et pousser si des fichiers ont été modifiés
        if git diff --cached --quiet; then
          echo "Aucun fichier à commiter"
        else
          git commit -m "Update generated PNG files from kmeanscs.py"
          git pull --rebase origin main
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
        fi
