name: Exécuter trace2.py

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Configurer Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Exécuter le script
      run: python trace2.py
    
    - name: Vérifier les fichiers générés
      run: ls -la *.png 2>/dev/null || echo "Aucun fichier PNG trouvé"
    
    - name: Commiter le graphique
      if: always()
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -f trace_output.png ]; then
          git add trace_output.png
          git commit -m "Update trace_output.png"
          git push https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main
        else
          echo "Fichier trace_output.png non généré"
        fi
